name: attest-idp-lab

# Spike #3 lab: does Keycloak actually ENFORCE the AAGUID allowlist and
# authenticator-attachment restriction at enrolment?
#
# Deliberately local-only and throwaway. The credentials are GENERATED, not committed
# (see lab/keycloak/scripts/lab_env.py), and this stack must never be reused for
# anything real.
#
# ---------------------------------------------------------------------------
# THIS STACK IS NOW EXPOSED BEYOND LOCALHOST, AND THAT IS A REAL CHANGE
#
# This file used to say "must never be exposed beyond localhost". It now is, on
# purpose, through a Cloudflare Tunnel, so that WebAuthn could be tested on a real
# origin under real TLS rather than on http://localhost.
#
# Exposure was a deliberate decision and it carries risk that localhost did not:
#
#   * `start-dev` is NOT a production mode. Keycloak warns about this itself.
#   * There is no rate limiting, no lockout tuning, no brute-force protection.
#   * The admin console is reachable at /admin on the public hostname.
#   * The hostnames are discoverable, and `id.210security.com` says what it is.
#
# It is a lab. If it is left running, put Cloudflare Access in front of it — that is
# a few clicks and removes the whole class of problem. Do not treat this as a
# deployment, and do not put real accounts in it.
# ---------------------------------------------------------------------------
#
# WebAuthn note: browsers treat http://localhost as a SECURE CONTEXT, so real
# WebAuthn ceremonies work locally without TLS. Behind the tunnel the RP ID is
# id.210security.com instead, which is a narrower relying-party ID and therefore the
# safer of the two.

services:
  postgres:
    image: postgres:17-alpine
    container_name: attest-lab-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${LAB_POSTGRES_PASSWORD:?run 'python3 lab/keycloak/scripts/lab_env.py' first}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [labnet]

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: attest-lab-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      # Keycloak 26 renamed the bootstrap admin vars to KC_BOOTSTRAP_ADMIN_*.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${LAB_KEYCLOAK_ADMIN_PASSWORD:?set LAB_KEYCLOAK_ADMIN_PASSWORD or create lab/.env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${LAB_POSTGRES_PASSWORD:?set LAB_POSTGRES_PASSWORD or create lab/.env}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # start-dev is intentional: no hostname strictness, HTTP allowed.
      KC_LOG_LEVEL: INFO

      # NOTE: the public-hostname settings are NOT here. They live in
      # `compose.tunnel.yaml`, applied as an overlay:
      #
      #   docker compose -f lab/keycloak/compose.yaml \
      #                  -f lab/keycloak/compose.tunnel.yaml up -d
      #
      # They cannot live here as `${VAR:-}` defaults. An EMPTY VALUE IS INVALID for
      # KC_PROXY_HEADERS — Keycloak refuses to start:
      #
      #   Invalid value for option 'KC_PROXY_HEADERS': .
      #   Expected values are: forwarded, xforwarded
      #
      # and the option has no "unset" spelling that survives an empty expansion. An
      # overlay is the only way to add it conditionally, and it keeps the base file
      # local-only by construction rather than by convention.
    ports:
      - "8080:8080"   # HTTP / admin console
      - "9000:9000"   # management: /health, /metrics
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # --import-realm reads every *.json in this directory at startup.
      - ./realm-config:/opt/keycloak/data/import:ro
    networks: [labnet]

  # The S5f mail sink, ON THE SAME NETWORK as Keycloak.
  #
  # It was first run on the host and reached via host.docker.internal. That works
  # on Docker Desktop and NOT on a Linux runner, and the failure is SILENT: the
  # container simply never connects and no mail arrives, with nothing in any log
  # to say why. Putting it on the same Docker network removes the whole class of
  # problem — Docker's own DNS resolves the name, identically everywhere.
  smtp-sink:
    image: python:3.12-alpine
    container_name: attest-lab-smtp
    working_dir: /scripts
    volumes:
      - ./scripts:/scripts:ro
      - /tmp/attest-mail:/mail
    command: ["python", "smtp_sink.py", "--host", "0.0.0.0", "2525", "/mail"]
    ports:
      - "2525:2525"
    networks: [labnet]

volumes:
  pgdata:

networks:
  labnet:
