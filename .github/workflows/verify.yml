# Re-verify everything that has been claimed.
#
# WHY THIS EXISTS
#   The verification experiments were originally run by hand. Nothing stopped a
#   later change from quietly invalidating a result that the documentation still
#   asserted — which is the exact failure mode this project is trying to avoid.
#   So the experiments are re-run on every push, and a claim that stops holding
#   fails the build rather than sitting in a markdown file looking true.
#
# WHAT IS AND IS NOT COVERED
#   covered     documentation integrity; the DPoP experiment (S1); the
#               hardware-key enforcement experiment (S3)
#   not covered the step-up experiment (S5) — it needs a browser flow and a
#               realm rebuild that is slow and, given S5b rejected the mechanism,
#               of no ongoing value; the browser-key experiment (S4) — its
#               Chromium runs are reproducible locally in ~30 seconds and add
#               little as a gate
#
# THIS WORKFLOW IS VERIFIED
#   It has run green on GitHub: docs 7s, dpop 59s, hardware-keys 2m12s. The
#   hardware-keys job passing on Linux is itself a result — the experiment was
#   developed on macOS, so the findings are not an artifact of one platform.
#
# THE GATES ARE NEGATIVE-TESTED
#   Writing this workflow exposed that two scripts printed PASS/FAIL rows without
#   ever affecting their exit code — so a job would have gone green on a total
#   regression. Both are fixed, and both fixes were tested by deliberately
#   breaking them and confirming a non-zero exit. A job that has only ever been
#   seen to pass has not been shown to be capable of failing.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Documentation. Fast and certain: it only needs Python and the Markdown.
  # ---------------------------------------------------------------------------
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the docs toolchain
        run: pip install -r requirements-docs.txt

      - name: Validate the workflows strictly
        # A duplicate key is VALID to PyYAML and REJECTED by GitHub, which is how a step
        # ended up with two `run:` keys and failed a run in zero seconds. This also
        # asserts that every lab start generates credentials and every compose call is
        # given --env-file.
        run: python3 scripts/check_workflows.py

      - name: Check the documentation
        # Links resolve, anchors exist, nothing loads from the network, every
        # section has a heading, and the committed site matches its sources.
        run: python3 scripts/check_docs.py

  # ---------------------------------------------------------------------------
  # The DPoP experiment (S1). No browser needed, so this is a reliable gate.
  # ---------------------------------------------------------------------------
  dpop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate the lab credentials
        # The lab no longer ships a hardcoded password: it generates one into
        # lab/.env, which is gitignored. See lab/keycloak/scripts/lab_env.py.
        run: |
          python3 - <<'PYEOF'
          import sys; sys.path.insert(0, 'lab/keycloak/scripts')
          import lab_env; lab_env.ensure_env_file()
          PYEOF

      - name: Install the lab toolchain
        run: pip install -r requirements-lab.txt

      - name: Start the identity provider and its database
        run: docker compose --env-file lab/.env -f lab/keycloak/compose.yaml up -d

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9000/health/ready >/dev/null 2>&1; then
              echo "ready after ~$((i*3))s"
              exit 0
            fi
            sleep 3
          done
          echo "identity provider did not become ready"
          docker compose --env-file lab/.env -f lab/keycloak/compose.yaml logs --tail 50
          exit 1

      - name: S1 — token binding, and our own verifier
        # Asserts 6/6 enforcement behaviours and 6/6 checks in the verifier.
        # Exits non-zero if any behaviour regresses.
        run: python3 lab/keycloak/scripts/dpop_spike.py

      - name: Show the provider log on failure
        if: failure()
        run: docker compose --env-file lab/.env -f lab/keycloak/compose.yaml logs --tail 100

  # ---------------------------------------------------------------------------
  # The freshness experiment (S5c). No browser needed: it builds its own
  # throwaway realm and drives Keycloak over HTTP. This is the control that
  # replaced the rejected LoA step-up, so it is worth keeping honest.
  # ---------------------------------------------------------------------------
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate the lab credentials
        # The lab no longer ships a hardcoded password: it generates one into
        # lab/.env, which is gitignored. See lab/keycloak/scripts/lab_env.py.
        run: |
          python3 - <<'PYEOF'
          import sys; sys.path.insert(0, 'lab/keycloak/scripts')
          import lab_env; lab_env.ensure_env_file()
          PYEOF

      - name: Install the lab toolchain
        run: pip install -r requirements-lab.txt

      - name: Start the identity provider and its database
        run: docker compose --env-file lab/.env -f lab/keycloak/compose.yaml up -d

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/health/ready >/dev/null 2>&1 && exit 0
            sleep 3
          done
          docker compose --env-file lab/.env -f lab/keycloak/compose.yaml logs --tail 50
          exit 1

      - name: S5c — force a fresh check, and judge it by auth_time
        # Asserts 14 checks including five controls. The controls are the point:
        # a reused session must NOT change auth_time, an old token must keep its
        # old auth_time, and the policy must refuse both stale tokens and tokens
        # with no auth_time at all.
        #
        # This step also prints FINDINGS separately from gates. A finding does not
        # fail the build, so read the output — currently it reports that the
        # privileged flow still accepts a password. See WORK.md S5d.
        run: python3 lab/keycloak/scripts/freshness_spike.py

      - name: Show the provider log on failure
        if: failure()
        run: docker compose --env-file lab/.env -f lab/keycloak/compose.yaml logs --tail 100

  # ---------------------------------------------------------------------------
  # Phishing resistance (S9). The headline claim. Needs a browser for the passkey
  # ceremonies and the relay proxy, which runs on the same network.
  # ---------------------------------------------------------------------------
  phishing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate the lab credentials
        # The lab no longer ships a hardcoded password: it generates one into
        # lab/.env, which is gitignored. See lab/keycloak/scripts/lab_env.py.
        run: |
          python3 - <<'PYEOF'
          import sys; sys.path.insert(0, 'lab/keycloak/scripts')
          import lab_env; lab_env.ensure_env_file()
          PYEOF

      - name: Install the toolchains
        run: |
          pip install -r requirements-lab.txt
          npm --prefix lab/keycloak install --no-audit --no-fund

      - name: Start the identity provider and its database
        run: docker compose --env-file lab/.env -f lab/keycloak/compose.yaml up -d

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/health/ready >/dev/null 2>&1 && exit 0
            sleep 3
          done
          docker compose --env-file lab/.env -f lab/keycloak/compose.yaml logs --tail 50
          exit 1

      - name: Apply the WebAuthn policies
        run: python3 lab/keycloak/scripts/configure-realms.py

      - name: Start the phishing relay
        # The victim's browser is directed at evil.localhost, and the relay forwards
        # to the real Keycloak. *.localhost resolves to loopback by convention, so
        # no /etc/hosts edit is needed.
        run: |
          nohup python3 lab/keycloak/scripts/phishing_proxy.py \
            --listen evil.localhost:9001 --upstream localhost:8080 \
            > /tmp/proxy.log 2>&1 &
          sleep 2
          head -1 /tmp/proxy.log
          curl -sf "http://evil.localhost:9001/realms/attest-privileged/.well-known/openid-configuration" \
            >/dev/null && echo "relay is serving the real provider"

      - name: Launch Chrome with remote debugging
        run: |
          google-chrome --headless --disable-gpu --no-sandbox \
            --disable-dev-shm-usage --remote-debugging-port=9222 \
            --user-data-dir=/tmp/ci-chrome-s9 about:blank &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:9222/json/version >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "Chrome did not expose a debugging port"
          exit 1

      - name: S9 — does a phishing proxy actually fail?
        run: |
          set +e
          python3 lab/keycloak/scripts/spike9-matrix.py > /tmp/s9.log 2>&1
          code=$?
          cat /tmp/s9.log
          echo "===== end of S9 output (exit $code) ====="
          exit $code

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose --env-file lab/.env -f lab/keycloak/compose.yaml logs --tail 80
          cat /tmp/proxy.log || true

  # ---------------------------------------------------------------------------
  # L1 + L2 — the API as a policy enforcement point. Token verification and DPoP
  # proof verification, both against the real identity provider, plus a synthetic
  # issuer for shapes Keycloak will not mint. The suite creates its own realm and
  # clients, so it needs Keycloak up but nothing else.
  # ---------------------------------------------------------------------------
  api-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node >= 23.6 runs the .ts sources directly via type stripping, which is
          # why there is no build step before the tests.
          node-version: '24'

      - name: Generate the lab credentials
        # The lab no longer ships a hardcoded password: it generates one into
        # lab/.env, which is gitignored. See lab/keycloak/scripts/lab_env.py.
        run: |
          python3 - <<'PYEOF'
          import sys; sys.path.insert(0, 'lab/keycloak/scripts')
          import lab_env; lab_env.ensure_env_file()
          PYEOF

      - name: Start the identity provider and its database
        run: docker compose --env-file lab/.env -f lab/keycloak/compose.yaml up -d

      - name: Start the application backing services
        # Separate from the Keycloak database on purpose: different data, different
        # blast radius. Postgres runs an init script that creates a NON-superuser
        # application role and forces Row-Level Security (see lab/app/init); s3mock
        # provides an S3-compatible endpoint so the S3 adapter is tested for real.
        run: docker compose --env-file lab/.env -f lab/app/compose.yaml up -d

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/health/ready >/dev/null 2>&1 && exit 0
            sleep 3
          done
          docker compose --env-file lab/.env -f lab/keycloak/compose.yaml logs --tail 50
          exit 1

      - name: Wait for the application backing services
        run: |
          for i in $(seq 1 40); do
            db=0; s3=0
            docker exec attest-app-postgres pg_isready -U attest_owner -d attest >/dev/null 2>&1 && db=1
            curl -sf -o /dev/null http://127.0.0.1:59090/ 2>/dev/null && s3=1
            [ "$db" = "1" ] && [ "$s3" = "1" ] && exit 0
            sleep 3
          done
          docker compose --env-file lab/.env -f lab/app/compose.yaml logs --tail 50
          exit 1

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck --workspace @attest/api

      - name: L1 + L2 + L3 + L4 + L5 — verification, authorization and storage
        run: |
          set +e
          npm test --workspace @attest/api > /tmp/l1.log 2>&1
          code=$?
          cat /tmp/l1.log
          echo "===== end of L1 output (exit $code) ====="
          exit $code

      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file lab/.env -f lab/keycloak/compose.yaml logs --tail 80

  # ---------------------------------------------------------------------------
  # The counter-case for phishing resistance (S9b). Chrome is launched by the
  # script itself, with the DNS and secure-context flags it needs.
  # ---------------------------------------------------------------------------
  phishing-counter-case:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate the lab credentials
        # The lab no longer ships a hardcoded password: it generates one into
        # lab/.env, which is gitignored. See lab/keycloak/scripts/lab_env.py.
        run: |
          python3 - <<'PYEOF'
          import sys; sys.path.insert(0, 'lab/keycloak/scripts')
          import lab_env; lab_env.ensure_env_file()
          PYEOF

      - name: Install the toolchains
        run: |
          pip install -r requirements-lab.txt
          npm --prefix lab/keycloak install --no-audit --no-fund

      - name: Start the identity provider and its database
        run: docker compose --env-file lab/.env -f lab/keycloak/compose.yaml up -d

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/health/ready >/dev/null 2>&1 && exit 0
            sleep 3
          done
          docker compose --env-file lab/.env -f lab/keycloak/compose.yaml logs --tail 50
          exit 1

      - name: Apply the WebAuthn policies
        run: python3 lab/keycloak/scripts/configure-realms.py

      - name: S9b — is a broad relying-party ID exploitable?
        run: |
          set +e
          python3 lab/keycloak/scripts/spike9b-meta.py > /tmp/s9b.log 2>&1
          code=$?
          cat /tmp/s9b.log
          echo "===== end of S9b output (exit $code) ====="
          exit $code

      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file lab/.env -f lab/keycloak/compose.yaml logs --tail 80

  # ---------------------------------------------------------------------------
  # Enrolment by link (S5f). Needs a browser for the one check that matters —
  # completing a real enrolment through the emailed link — and a mail sink to
  # capture the link.
  # ---------------------------------------------------------------------------
  enrolment-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate the lab credentials
        # The lab no longer ships a hardcoded password: it generates one into
        # lab/.env, which is gitignored. See lab/keycloak/scripts/lab_env.py.
        run: |
          python3 - <<'PYEOF'
          import sys; sys.path.insert(0, 'lab/keycloak/scripts')
          import lab_env; lab_env.ensure_env_file()
          PYEOF

      - name: Install the toolchains
        run: |
          pip install -r requirements-lab.txt
          npm --prefix lab/keycloak install --no-audit --no-fund

      - name: Start the identity provider and its database
        run: docker compose --env-file lab/.env -f lab/keycloak/compose.yaml up -d

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/health/ready >/dev/null 2>&1 && exit 0
            sleep 3
          done
          docker compose --env-file lab/.env -f lab/keycloak/compose.yaml logs --tail 50
          exit 1

      - name: Apply the WebAuthn policies
        run: python3 lab/keycloak/scripts/configure-realms.py

      - name: Prepare the mail drop
        # The sink runs as a compose service on the same Docker network as
        # Keycloak, so there is no host-networking to get wrong. This only clears
        # the directory it writes into.
        run: |
          rm -rf /tmp/attest-mail && mkdir -p /tmp/attest-mail
          docker compose --env-file lab/.env -f lab/keycloak/compose.yaml up -d smtp-sink
          sleep 2
          docker compose --env-file lab/.env -f lab/keycloak/compose.yaml logs smtp-sink --tail 5

      - name: Launch Chrome with remote debugging
        run: |
          google-chrome --headless --disable-gpu --no-sandbox \
            --disable-dev-shm-usage --remote-debugging-port=9222 \
            --user-data-dir=/tmp/ci-chrome-s5f about:blank &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:9222/json/version >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "Chrome did not expose a debugging port"
          exit 1

      - name: S5f — is enrolment per-user by link?
        run: |
          set +e
          python3 lab/keycloak/scripts/spike5f-matrix.py > /tmp/s5f.log 2>&1
          code=$?
          cat /tmp/s5f.log
          echo "===== end of S5f output (exit $code) ====="
          exit $code

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose --env-file lab/.env -f lab/keycloak/compose.yaml logs --tail 80
          echo "--- mail sink ---"
          cat /tmp/smtp-sink.log || true

  # ---------------------------------------------------------------------------
  # The enrolment window (S5e). No browser needed.
  # ---------------------------------------------------------------------------
  enrolment-window:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate the lab credentials
        # The lab no longer ships a hardcoded password: it generates one into
        # lab/.env, which is gitignored. See lab/keycloak/scripts/lab_env.py.
        run: |
          python3 - <<'PYEOF'
          import sys; sys.path.insert(0, 'lab/keycloak/scripts')
          import lab_env; lab_env.ensure_env_file()
          PYEOF

      - name: Install the lab toolchain
        run: pip install -r requirements-lab.txt

      - name: Start the identity provider and its database
        run: docker compose --env-file lab/.env -f lab/keycloak/compose.yaml up -d

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/health/ready >/dev/null 2>&1 && exit 0
            sleep 3
          done
          docker compose --env-file lab/.env -f lab/keycloak/compose.yaml logs --tail 50
          exit 1

      - name: Apply the WebAuthn policies
        run: python3 lab/keycloak/scripts/configure-realms.py

      - name: S5e — is the enrolment window bounded, audited and gated?
        # 14 checks. The time limit is tested by WAITING for a real one-minute
        # window to expire, not by editing a timestamp — so this takes ~3 minutes.
        #
        # E12 is a FINDING, not a gate: the per-user restriction does not work,
        # and pinning it as a test means it cannot be quietly forgotten.
        run: |
          set +e
          python3 lab/keycloak/scripts/spike5e-matrix.py > /tmp/s5e.log 2>&1
          code=$?
          cat /tmp/s5e.log
          echo "===== end of S5e output (exit $code) ====="
          exit $code

      - name: Show the provider log on failure
        if: failure()
        run: docker compose --env-file lab/.env -f lab/keycloak/compose.yaml logs --tail 100

  # ---------------------------------------------------------------------------
  # Passkey-only enforcement (S5d). Needs a browser for one check — the positive
  # case, that a passkey actually signs in — because a flow that refuses
  # everything would otherwise satisfy every negative test.
  # ---------------------------------------------------------------------------
  passkey-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate the lab credentials
        # The lab no longer ships a hardcoded password: it generates one into
        # lab/.env, which is gitignored. See lab/keycloak/scripts/lab_env.py.
        run: |
          python3 - <<'PYEOF'
          import sys; sys.path.insert(0, 'lab/keycloak/scripts')
          import lab_env; lab_env.ensure_env_file()
          PYEOF

      - name: Install the toolchains
        run: |
          pip install -r requirements-lab.txt
          npm --prefix lab/keycloak install --no-audit --no-fund

      - name: Start the identity provider and its database
        run: docker compose --env-file lab/.env -f lab/keycloak/compose.yaml up -d

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/health/ready >/dev/null 2>&1 && exit 0
            sleep 3
          done
          docker compose --env-file lab/.env -f lab/keycloak/compose.yaml logs --tail 50
          exit 1

      - name: Apply the WebAuthn policies
        run: python3 lab/keycloak/scripts/configure-realms.py

      - name: Launch Chrome with remote debugging
        run: |
          google-chrome --headless --disable-gpu --no-sandbox \
            --disable-dev-shm-usage --remote-debugging-port=9222 \
            --user-data-dir=/tmp/ci-chrome-s5d about:blank &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:9222/json/version >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "Chrome did not expose a debugging port"
          exit 1

      - name: S5d — is the privileged realm actually passkey-only?
        # 12 checks. The ones that matter most: a direct password grant must be
        # refused (that bypass hid behind a passing test once already), and a
        # passkey must actually sign in (or "refused" would also be satisfied by
        # a flow that refuses everything).
        #
        # This leaves the realm REVERTED on purpose, so the shared fixture stays
        # usable for the other jobs' expectations.
        #
        # The output is captured and echoed rather than streamed, because the
        # GitHub log-download API returned "BlobNotFound" for this job and the
        # failure was invisible. Embedding it in the step means the reason is
        # always in the log, whatever happens to the log API.
        run: |
          echo "===== environment ====="
          echo "python3 : $(which python3) $(python3 --version 2>&1)"
          echo "node    : $(node --version)"
          echo "chrome  : $(which google-chrome || echo 'not on PATH')"
          curl -sf http://127.0.0.1:9222/json/version | head -c 80 || echo "cdp unreachable"
          echo
          echo "===== run ====="
          cd lab/keycloak
          set +e
          node scripts/spike5d-matrix.mjs > /tmp/s5d.log 2>&1
          code=$?
          cat /tmp/s5d.log
          echo "===== end of S5d output (exit $code) ====="
          exit $code

      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file lab/.env -f lab/keycloak/compose.yaml logs --tail 100

  # ---------------------------------------------------------------------------
  # The hardware-key experiment (S3). Needs a browser with a virtual
  # authenticator, driven over the Chrome DevTools Protocol.
  # ---------------------------------------------------------------------------
  hardware-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate the lab credentials
        # The lab no longer ships a hardcoded password: it generates one into
        # lab/.env, which is gitignored. See lab/keycloak/scripts/lab_env.py.
        run: |
          python3 - <<'PYEOF'
          import sys; sys.path.insert(0, 'lab/keycloak/scripts')
          import lab_env; lab_env.ensure_env_file()
          PYEOF

      - name: Install the toolchains
        run: |
          pip install -r requirements-lab.txt
          npm --prefix lab/keycloak install --no-audit --no-fund

      - name: Start the identity provider and its database
        run: docker compose --env-file lab/.env -f lab/keycloak/compose.yaml up -d

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/health/ready >/dev/null 2>&1 && exit 0
            sleep 3
          done
          docker compose --env-file lab/.env -f lab/keycloak/compose.yaml logs --tail 50
          exit 1

      - name: Apply the WebAuthn policies
        run: python3 lab/keycloak/scripts/configure-realms.py

      - name: Launch Chrome with remote debugging
        # --no-sandbox is required in containers; the virtual authenticator is
        # reached over CDP rather than through any browser UI.
        run: |
          google-chrome --headless --disable-gpu --no-sandbox \
            --disable-dev-shm-usage --remote-debugging-port=9222 \
            --user-data-dir=/tmp/ci-chrome about:blank &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:9222/json/version >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "Chrome did not expose a debugging port"
          exit 1

      - name: S3 — hardware-key enforcement matrix
        # Five rows; two of them are controls. A control failing means the
        # experiment is not measuring what it claims, so this must fail loudly.
        run: bash lab/keycloak/scripts/run-matrix.sh

      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file lab/.env -f lab/keycloak/compose.yaml logs --tail 100
