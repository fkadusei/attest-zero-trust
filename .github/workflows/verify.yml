# Re-verify everything that has been claimed.
#
# WHY THIS EXISTS
#   The verification experiments were originally run by hand. Nothing stopped a
#   later change from quietly invalidating a result that the documentation still
#   asserted — which is the exact failure mode this project is trying to avoid.
#   So the experiments are re-run on every push, and a claim that stops holding
#   fails the build rather than sitting in a markdown file looking true.
#
# WHAT IS AND IS NOT COVERED
#   covered     documentation integrity; the DPoP experiment (S1); the
#               hardware-key enforcement experiment (S3)
#   not covered the step-up experiment (S5) — it needs a browser flow and a
#               realm rebuild that is slow and, given S5b rejected the mechanism,
#               of no ongoing value; the browser-key experiment (S4) — its
#               Chromium runs are reproducible locally in ~30 seconds and add
#               little as a gate
#
# THIS WORKFLOW IS VERIFIED
#   It has run green on GitHub: docs 7s, dpop 59s, hardware-keys 2m12s. The
#   hardware-keys job passing on Linux is itself a result — the experiment was
#   developed on macOS, so the findings are not an artifact of one platform.
#
# THE GATES ARE NEGATIVE-TESTED
#   Writing this workflow exposed that two scripts printed PASS/FAIL rows without
#   ever affecting their exit code — so a job would have gone green on a total
#   regression. Both are fixed, and both fixes were tested by deliberately
#   breaking them and confirming a non-zero exit. A job that has only ever been
#   seen to pass has not been shown to be capable of failing.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Documentation. Fast and certain: it only needs Python and the Markdown.
  # ---------------------------------------------------------------------------
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the docs toolchain
        run: pip install -r requirements-docs.txt

      - name: Check the documentation
        # Links resolve, anchors exist, nothing loads from the network, every
        # section has a heading, and the committed site matches its sources.
        run: python3 scripts/check_docs.py

  # ---------------------------------------------------------------------------
  # The DPoP experiment (S1). No browser needed, so this is a reliable gate.
  # ---------------------------------------------------------------------------
  dpop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the lab toolchain
        run: pip install -r requirements-lab.txt

      - name: Start the identity provider and its database
        run: docker compose -f lab/keycloak/compose.yaml up -d

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9000/health/ready >/dev/null 2>&1; then
              echo "ready after ~$((i*3))s"
              exit 0
            fi
            sleep 3
          done
          echo "identity provider did not become ready"
          docker compose -f lab/keycloak/compose.yaml logs --tail 50
          exit 1

      - name: S1 — token binding, and our own verifier
        # Asserts 6/6 enforcement behaviours and 6/6 checks in the verifier.
        # Exits non-zero if any behaviour regresses.
        run: python3 lab/keycloak/scripts/dpop_spike.py

      - name: Show the provider log on failure
        if: failure()
        run: docker compose -f lab/keycloak/compose.yaml logs --tail 100

  # ---------------------------------------------------------------------------
  # The freshness experiment (S5c). No browser needed: it builds its own
  # throwaway realm and drives Keycloak over HTTP. This is the control that
  # replaced the rejected LoA step-up, so it is worth keeping honest.
  # ---------------------------------------------------------------------------
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the lab toolchain
        run: pip install -r requirements-lab.txt

      - name: Start the identity provider and its database
        run: docker compose -f lab/keycloak/compose.yaml up -d

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/health/ready >/dev/null 2>&1 && exit 0
            sleep 3
          done
          docker compose -f lab/keycloak/compose.yaml logs --tail 50
          exit 1

      - name: S5c — force a fresh check, and judge it by auth_time
        # Asserts 14 checks including five controls. The controls are the point:
        # a reused session must NOT change auth_time, an old token must keep its
        # old auth_time, and the policy must refuse both stale tokens and tokens
        # with no auth_time at all.
        #
        # This step also prints FINDINGS separately from gates. A finding does not
        # fail the build, so read the output — currently it reports that the
        # privileged flow still accepts a password. See WORK.md S5d.
        run: python3 lab/keycloak/scripts/freshness_spike.py

      - name: Show the provider log on failure
        if: failure()
        run: docker compose -f lab/keycloak/compose.yaml logs --tail 100

  # ---------------------------------------------------------------------------
  # Passkey-only enforcement (S5d). Needs a browser for one check — the positive
  # case, that a passkey actually signs in — because a flow that refuses
  # everything would otherwise satisfy every negative test.
  # ---------------------------------------------------------------------------
  passkey-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the toolchains
        run: |
          pip install -r requirements-lab.txt
          npm --prefix lab/keycloak install --no-audit --no-fund

      - name: Start the identity provider and its database
        run: docker compose -f lab/keycloak/compose.yaml up -d

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/health/ready >/dev/null 2>&1 && exit 0
            sleep 3
          done
          docker compose -f lab/keycloak/compose.yaml logs --tail 50
          exit 1

      - name: Apply the WebAuthn policies
        run: python3 lab/keycloak/scripts/configure-realms.py

      - name: Launch Chrome with remote debugging
        run: |
          google-chrome --headless --disable-gpu --no-sandbox \
            --disable-dev-shm-usage --remote-debugging-port=9222 \
            --user-data-dir=/tmp/ci-chrome-s5d about:blank &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:9222/json/version >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "Chrome did not expose a debugging port"
          exit 1

      - name: S5d — is the privileged realm actually passkey-only?
        # 12 checks. The ones that matter most: a direct password grant must be
        # refused (that bypass hid behind a passing test once already), and a
        # passkey must actually sign in (or "refused" would also be satisfied by
        # a flow that refuses everything).
        #
        # This leaves the realm REVERTED on purpose, so the shared fixture stays
        # usable for the other jobs' expectations.
        #
        # The output is captured and echoed rather than streamed, because the
        # GitHub log-download API returned "BlobNotFound" for this job and the
        # failure was invisible. Embedding it in the step means the reason is
        # always in the log, whatever happens to the log API.
        run: |
          echo "===== environment ====="
          echo "python3 : $(which python3) $(python3 --version 2>&1)"
          echo "node    : $(node --version)"
          echo "chrome  : $(which google-chrome || echo 'not on PATH')"
          curl -sf http://127.0.0.1:9222/json/version | head -c 80 || echo "cdp unreachable"
          echo
          echo "===== run ====="
          cd lab/keycloak
          set +e
          node scripts/spike5d-matrix.mjs > /tmp/s5d.log 2>&1
          code=$?
          cat /tmp/s5d.log
          echo "===== end of S5d output (exit $code) ====="
          exit $code

      - name: Show logs on failure
        if: failure()
        run: docker compose -f lab/keycloak/compose.yaml logs --tail 100

  # ---------------------------------------------------------------------------
  # The hardware-key experiment (S3). Needs a browser with a virtual
  # authenticator, driven over the Chrome DevTools Protocol.
  # ---------------------------------------------------------------------------
  hardware-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the toolchains
        run: |
          pip install -r requirements-lab.txt
          npm --prefix lab/keycloak install --no-audit --no-fund

      - name: Start the identity provider and its database
        run: docker compose -f lab/keycloak/compose.yaml up -d

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/health/ready >/dev/null 2>&1 && exit 0
            sleep 3
          done
          docker compose -f lab/keycloak/compose.yaml logs --tail 50
          exit 1

      - name: Apply the WebAuthn policies
        run: python3 lab/keycloak/scripts/configure-realms.py

      - name: Launch Chrome with remote debugging
        # --no-sandbox is required in containers; the virtual authenticator is
        # reached over CDP rather than through any browser UI.
        run: |
          google-chrome --headless --disable-gpu --no-sandbox \
            --disable-dev-shm-usage --remote-debugging-port=9222 \
            --user-data-dir=/tmp/ci-chrome about:blank &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:9222/json/version >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "Chrome did not expose a debugging port"
          exit 1

      - name: S3 — hardware-key enforcement matrix
        # Five rows; two of them are controls. A control failing means the
        # experiment is not measuring what it claims, so this must fail loudly.
        run: bash lab/keycloak/scripts/run-matrix.sh

      - name: Show logs on failure
        if: failure()
        run: docker compose -f lab/keycloak/compose.yaml logs --tail 100
